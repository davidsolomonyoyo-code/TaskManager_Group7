<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Page Heading -->
    <header>
            <h1>Taskify</h1>
            <p class="subtitle">Stay organized. Stay productive.</p>
    </header>
    <!-- Task Input Form -->
    <section id="taskFormSection">
        <form id="taskForm">
            <!-- Task Title -->
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter task title" 
                required
            >
            <!-- Priority Dropdown -->
            <select id="prioritySelect">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
            <!-- Due Date -->
            <input 
                type="date" 
                id="dateInput"
            >
            <!-- Add Task Button -->
            <button type="submit" id="addTaskBtn">
                Add Task
            </button>

        </form>  
    </section>
    <!-- Sorting Buttons -->
    <section id="sortSection">
        <button id="sortDateBtn">Sort by Date</button>
        <button id="sortPriorityBtn">Sort by Priority</button>
    </section>
        <!-- Task List Display Area -->
    <section id="taskListSection">
        <ul id="taskList">
            <!-- Tasks will be dynamically inserted here -->
        </ul>
    </section>
    
    <script src="script.js"></script>

</body>
</html>
